<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gridv21 CEO Dashboard</title>
  <style>
    body { font-family: -apple-system, system-ui; background: #0a0a0a; color: #fff; margin: 0; padding: 16px; }
    .header { margin-bottom: 20px; }
    .stats { display: flex; gap: 12px; margin-bottom: 20px; }
    .stat { background: #1a1a1a; padding: 12px; border-radius: 8px; flex: 1; text-align: center; }
    .stat h3 { margin: 0; font-size: 24px; color: #0f0; }
    .stat p { margin: 4px 0 0; font-size: 12px; color: #888; }
    .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .card h4 { margin: 0 0 8px; font-size: 16px; }
    .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
    .score { color: #0f0; font-weight: bold; }
    .actions { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .kill { background: #ff4444; color: #fff; }
    .edit { background: #4444ff; color: #fff; }
    .boost { background: #00aa00; color: #fff; }
    .blacklist { background: #666; color: #fff; }
    input, textarea { width: 100%; background: #0a0a0a; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; margin: 4px 0; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; }
    .modal-content { background: #1a1a1a; padding: 20px; border-radius: 12px; max-width: 500px; margin: 40px auto; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gridv21 CEO Dashboard</h1>
    <p>The ball is rolling. You just steer.</p>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><h3 id="liveCount">-</h3><p>Live Posts</p></div>
    <div class="stat"><h3 id="leadCount">-</h3><p>Leads Month 1</p></div>
    <div class="stat"><h3 id="revenue">$0</h3><p>Est. Revenue</p></div>
  </div>

  <div id="posts"></div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Live Post</h3>
      <input id="editTitle" placeholder="Title">
      <textarea id="editMeta" rows="3" placeholder="Meta description"></textarea>
      <div class="actions">
        <button class="edit" onclick="saveEdit()">Save</button>
        <button class="kill" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

<script>
const API = window.location.origin;
const KEY = new URLSearchParams(location.search).get('key');
let currentEditId = null;

async function loadDashboard() {
  try {
    const [dash, leads] = await Promise.all([
      fetch(`${API}/admin/dashboard?key=${KEY}`).then(r => r.json()),
      fetch(`${API}/api/leads/count`).then(r => r.json())
    ]);

    document.getElementById('liveCount').innerText = dash.live_posts.length;
    document.getElementById('leadCount').innerText = leads.total_leads;
    document.getElementById('revenue').innerText = `$${Math.round(leads.estimated_revenue)}`;

    const postsDiv = document.getElementById('posts');
    postsDiv.innerHTML = dash.live_posts.map(p => `
      <div class="card">
        <h4>${p.title}</h4>
        <div class="meta">
          Tool: ${p.tools.name} | Type: ${p.tools.type} | 
          Score: <span class="score">${Math.round(p.score)}</span> | 
          Clicks: ${p.tools.clicks} | Leads: ${p.tools.conversions}
        </div>
        <div class="actions">
          <button class="kill" onclick="killPost(${p.id})">Kill</button>
          <button class="edit" onclick="openEdit(${p.id}, '${p.title.replace(/'/g,"\\'")}', '${p.meta_description.replace(/'/g,"\\'")}')">Edit</button>
          <button class="boost" onclick="forceBoost(${p.tool_id}, true)">Force Boost</button>
          <button class="blacklist" onclick="forceBoost(${p.tool_id}, false)">Blacklist</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('posts').innerHTML = `<div class="card">Error loading: ${e}</div>`;
  }
}

async function killPost(id) {
  if (!confirm('Kill this post? It goes offline immediately.')) return;
  await fetch(`${API}/admin/unpublish/${id}?key=${KEY}`, { method: 'POST' });
  loadDashboard();
}

function openEdit(id, title, meta) {
  currentEditId = id;
  document.getElementById('editTitle').value = title;
  document.getElementById('editMeta').value = meta;
  document.getElementById('editModal').style.display = 'block';
}

function closeModal() {
  document.getElementById('editModal').style.display = 'none';
}

async function saveEdit() {
  await fetch(`${API}/admin/edit/${currentEditId}?key=${KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title: document.getElementById('editTitle').value,
      meta: document.getElementById('editMeta').value,
      edited: true
    })
  });
  closeModal();
  loadDashboard();
}

async function forceBoost(tool_id, force) {
  const notes = force? 'CEO forced boost' : 'CEO blacklisted';
  await fetch(`${API}/admin/override?key=${KEY}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tool_id, force_boost: force, notes })
  });
  alert(force? 'Tool will be boosted next cycle' : 'Tool blacklisted. No more posts.');
  loadDashboard();
}

loadDashboard();
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
